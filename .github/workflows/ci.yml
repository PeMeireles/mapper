name: OpenOrienteering Mapper (Windows MSYS2)

on:
  workflow_dispatch:
  push:
    branches: [ ui_scale_desktop, main, master, workflow ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # MSYS2 setup
      # -------------------------
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            base-devel
            git
            cmake
            ninja
            mingw-w64-x86_64-toolchain

      # -------------------------
      # Install dependencies (IMPORTANT FIX)
      # -------------------------
      - name: Install Qt + GIS dependencies
        shell: msys2 {0}
        run: |
          set -e

          pacman --noconfirm -Syu

          pacman --noconfirm --needed -S \
            mingw-w64-x86_64-qt5-base \
            mingw-w64-x86_64-qt5-tools \
            mingw-w64-x86_64-qt5-location \
            mingw-w64-x86_64-qt5-svg \
            mingw-w64-x86_64-qt5-imageformats \
            mingw-w64-x86_64-qt5-translations \
            mingw-w64-x86_64-qt5-sensors \
            mingw-w64-x86_64-qt5-serialport \
            mingw-w64-x86_64-gdal \
            mingw-w64-x86_64-proj \
            mingw-w64-x86_64-zlib \
            mingw-w64-x86_64-clipper

      # -------------------------
      # Environment setup (Azure-style)
      # -------------------------
      - name: Setup build environment
        shell: bash
        run: |
          set -e

          echo "SOURCE_DIR=$PWD" >> $GITHUB_ENV
          echo "SUPERBUILD_INSTALL_DIR=$PWD/install" >> $GITHUB_ENV

          VERSION_DISPLAY="${{ github.ref_name }} v${{ github.run_number }}"
          echo "VERSION_DISPLAY=$VERSION_DISPLAY" >> $GITHUB_ENV

      # -------------------------
      # Clone superbuild
      # -------------------------
      - name: Clone superbuild
        shell: bash
        run: |
          git clone --depth 1 https://github.com/openorienteering/superbuild.git

      # -------------------------
      # Configure superbuild
      # -------------------------
      - name: Configure
        shell: msys2 {0}
        run: |
          set -e

          mkdir -p build

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUPERBUILD_DISABLE_DEPENDENCIES=TRUE \
            -DMapper_CI_SOURCE_DIR=$SOURCE_DIR \
            -DMapper_CI_VERSION_DISPLAY="$VERSION_DISPLAY" \
            -DMapper_CI_QT_VERSION=5.12 \
            -DMapper_CI_ENABLE_GDAL=1 \
            -DMapper_CI_ENABLE_POSITIONING=1 \
            -Ddefault_INSTALL_PREFIX=$SUPERBUILD_INSTALL_DIR \
            superbuild

      # -------------------------
      # Build toolchain-info
      # -------------------------
      - name: Build toolchain-info
        shell: msys2 {0}
        run: |
          cmake --build build --target toolchain-info -j$(nproc)

      # -------------------------
      # Build main application
      # -------------------------
      - name: Build Mapper
        shell: msys2 {0}
        run: |
          cmake --build build --target openorienteering-mapper-ci -j$(nproc)

      # -------------------------
      # Collect output
      # -------------------------
      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p output
          find build -type f -iname "*.exe" -exec cp {} output/ \; || true

      # -------------------------
      # Upload artifact
      # -------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: openorienteering-mapper-windows
          path: output/